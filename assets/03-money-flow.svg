<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1122" height="992" viewBox="0 0 1122 992" role="img" aria-label="海外订单的资金与凭证"><rect width="1122" height="992" fill="#fbfaf7"/><rect x="0" y="0" width="1122" height="10" fill="#19232d"/><text x="64" y="70" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="21" letter-spacing="4" fill="#aa8454">AI / GLOBAL INCOME / CHINA</text><text x="1059" y="70" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" letter-spacing="4" fill="#987b54">FIG 03</text><text x="64" y="147" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="54" font-weight="600" fill="#111b24">海外订单的资金与凭证</text><text x="66" y="199" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#67717b">赚钱、收款、结汇和纳税需要配套</text><line x1="64" y1="258" x2="1058" y2="258" stroke="#e2ded5" stroke-width="2"/><text x="82" y="341" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="44" font-weight="400" fill="#9c774b">01</text><text x="235" y="319" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="37" font-weight="600" fill="#18202a">真实的海外订单</text><text x="236" y="364" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#70757a">客户主体、服务范围、金额、合同</text><line x1="64" y1="391" x2="1058" y2="391" stroke="#e2ded5" stroke-width="2"/><text x="82" y="474" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="44" font-weight="400" fill="#9c774b">02</text><text x="235" y="452" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="37" font-weight="600" fill="#18202a">合规平台或银行</text><text x="236" y="497" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#70757a">账户实名、支持地区、交易审核</text><line x1="64" y1="524" x2="1058" y2="524" stroke="#e2ded5"