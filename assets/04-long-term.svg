<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1122" height="992" viewBox="0 0 1122 992" role="img" aria-label="从第一笔订单走向长期收入"><rect width="1122" height="992" fill="#fbfaf7"/><rect x="0" y="0" width="1122" height="10" fill="#19232d"/><text x="64" y="70" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="21" letter-spacing="4" fill="#aa8454">AI / GLOBAL INCOME / CHINA</text><text x="1059" y="70" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" letter-spacing="4" fill="#987b54">FIG 04</text><text x="64" y="147" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="54" font-weight="600" fill="#111b24">从第一笔订单走向长期收入</text><text x="66" y="199" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#67717b">一开始重视成交与交付，稳定后再产品化</text><line x1="64" y1="258" x2="1058" y2="258" stroke="#e2ded5" stroke-width="2"/><text x="82" y="341" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="44" font-weight="400" fill="#9c774b">01</text><text x="235" y="319" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="37" font-weight="600" fill="#18202a">找到一个具体问题</text><text x="236" y="364" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#70757a">先在熟悉的行业观察付费需求</text><line x1="64" y1="391" x2="1058" y2="391" stroke="#e2ded5" stroke-width="2"/><text x="82" y="474" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="44" font-weight="400" fill="#9c774b">02</text><text x="235" y="452" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="37" font-weight="600" fill="#18202a">完成一笔小订单</text><text x="236" y="497" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#70757a">报价、合同、交付、收款全部跑通</text><line x1="64" y1="524" x2="1058" y2="524" stroke="#e2ded5" stroke-width="2"/><text x="82" y="607" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="44" font-weight="400" fill="#9c774b">03</text><text x="235" y="585" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="37" font-weight="600" fill="#18202a">积累口碑与复购</text><text x="236" y="630" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#70757a">记录交付质量，争取长期合作</text><line x1="64" y1="657" x2="1058" y2="657" stroke="#e2ded5" stroke-width="2"/><text x="82" y="740" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="44" font-weight="400" fill="#9c774b">04</text><text x="235" y="718" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="37" font-weight="600" fill="#18202a">沉淀产品与系统</text><text x="236" y="763" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#70757a">服务标准化后，再考虑工具与订阅</text><rect x="64" y="871" width="6" height="59" fill="#b49160"/><text x="89" y="908" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="28" fill="#8a6a40">不要把注册公司和买工具当作商业结果</text><text x="64" y="964" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" fill="#9e9c98">中国人赚美金保姆级攻略 · AI 酋长 Andy</text></svg>