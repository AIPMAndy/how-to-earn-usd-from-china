<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1122" height="992" viewBox="0 0 1122 992" role="img" aria-label="先跑通一笔真实的美元收入"><rect width="1122" height="992" fill="#fbfaf7"/><rect x="0" y="0" width="1122" height="10" fill="#19232d"/><text x="64" y="70" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="21" letter-spacing="4" fill="#aa8454">AI / GLOBAL INCOME / CHINA</text><text x="1059" y="70" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" letter-spacing="4" fill="#987b54">FIG 01</text><text x="64" y="147" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="54" font-weight="600" fill="#111b24">先跑通一笔真实的美元收入</text><text x="66" y="199" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="26" fill="#67717b">从海外客户到交付、收款，四个环节都要成立</text><line x1="64" y1="258" x2="1058" y2="258" stroke="#e2ded5" stroke-width="2"/><text x="82" y="341" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="44" font-weight="400" fill="#9c774b">01</text><text x="235" y="319" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="37" font-weight="600" fill="#18202a">确定客户需求</text><text x="236" y="364" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#70757a">先找正在付费解决这个问题的人</text><line x1="64" y1="391" x2="1058" y2="391" stroke="#e2ded5" stroke-width="2"/><text x="82" y="474" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="44" font-weight="400" fill="#9c774b">02</text><text x="235" y="452" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="37" font-weight="600" fill="#18202a">报价并签好约定</text><text x="236" y="497" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#70757a">明确交付内容、时限和修改范围</text><line x1="64" y1="524" x2="1058" y2="524" stroke="#e2ded5" stroke-width="2"/><text x="82" y="607" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="44" font-weight="400" fill="#9c774b">03</text><text x="235" y="585" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="37" font-weight="600" fill="#18202a">完成交付与验收</text><text x="236" y="630" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#70757a">按要求完成项目，保留记录与反馈</text><line x1="64" y1="657" x2="1058" y2="657" stroke="#e2ded5" stroke-width="2"/><text x="82" y="740" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="44" font-weight="400" fill="#9c774b">04</text><text x="235" y="718" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="37" font-weight="600" fill="#18202a">合规收款和记账</text><text x="236" y="763" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#70757a">检查账户资格、交易性质与凭证</text><rect x="64" y="871" width="6" height="59" fill="#b49160"/><text x="89" y="908" font-family="'Songti SC','Noto Serif CJK SC','STSong',serif" font-size="28" fill="#8a6a40">先把第一笔小订单做完整，再考虑扩大规模</text><text x="64" y="964" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" fill="#9e9c98">中国人赚美金保姆级攻略 · AI 酋长 Andy</text></svg>